name: Build mod
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 4.10.3
          cache-disabled: true
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Server smoke test (loads the mod in a real Forge server)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          (sleep 150; echo stop) | timeout 330 gradle runServer --no-daemon 2>&1 | tee server.log || true
      - name: Publish build log to branch buildlog
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/lg
          cp build.log /tmp/lg/build.log || echo "no log" > /tmp/lg/build.log
          cp server.log /tmp/lg/server.log 2>/dev/null || true
          cp run/logs/latest.log /tmp/lg/latest.log 2>/dev/null || true
          cp run/logs/debug.log /tmp/lg/debug.log 2>/dev/null || true
          mkdir -p /tmp/lg/crash && cp run/crash-reports/* /tmp/lg/crash/ 2>/dev/null || true
          cp build/libs/*.jar /tmp/lg/ 2>/dev/null || true
          JAR=$(find ~/.gradle/caches/forge_gradle/minecraft_user_repo -name '*mapped_snapshot*.jar' | head -1)
          echo "jar: $JAR" > /tmp/lg/api.txt
          if [ -n "$JAR" ]; then
            unzip -Z1 "$JAR" | grep '\.class$' | sed 's/\.class$//' | tr '/' '.' | sort > /tmp/lg/classes.txt
            if [ -f tools/javap_query.txt ]; then
              while read -r c; do [ -n "$c" ] && javap -public -cp "$JAR" "$c" 2>&1; done < tools/javap_query.txt > /tmp/lg/javap.txt
            fi
          fi
          cd /tmp/lg
          git init -q
          git checkout -q -b buildlog
          git add .
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "build log"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" buildlog
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: shadowmonarch-jar
          path: build/libs/*.jar
